<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pray for GP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #111111;
      --gray-700: #555555;
      --gray-500: #999999;
      --gray-300: #e0e0e0;
      --gray-200: #ececec;
      --gray-100: #f5f5f5;
      --white: #ffffff;
      --bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Proxima Nova', 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 { font-family: 'Instrument Serif', Georgia, serif; }

    /* ── APP SHELL ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      background: var(--white);
      border-bottom: 1px solid var(--gray-300);
      flex-shrink: 0;
      gap: 16px;
    }

    .topbar-left { display: flex; align-items: center; gap: 20px; }

    .logo {
      display: flex; align-items: center; gap: 9px;
      text-decoration: none;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--black);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px; flex-shrink: 0;
    }
    .logo h1 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--black);
      white-space: nowrap;
    }
    .logo h1 em { font-style: italic; color: var(--black); }

    .divider { width: 1px; height: 20px; background: var(--gray-300); }

    /* Month + nav */
    .month-nav {
      display: flex; align-items: center; gap: 10px;
    }
    .month-label {
      font-family: 'Instrument Serif', serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: var(--black);
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      user-select: none;
    }
    .month-label svg { opacity: 0.4; }
    .nav-btn {
      width: 26px; height: 26px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-500);
      font-size: 14px;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover { background: var(--gray-100); color: var(--black); }

    .today-btn {
      padding: 5px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 5px;
      background: none;
      font-size: 12px;
      font-family: inherit;
      color: var(--gray-700);
      cursor: pointer;
      transition: background 0.12s;
    }
    .today-btn:hover { background: var(--gray-100); }

    /* View tabs */
    .view-tabs {
      display: flex;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      overflow: hidden;
    }
    .view-tab {
      padding: 5px 13px;
      font-size: 12px;
      font-family: inherit;
      border: none;
      background: none;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.12s;
      letter-spacing: 0.2px;
    }
    .view-tab + .view-tab { border-left: 1px solid var(--gray-300); }
    .view-tab.active { background: var(--black); color: var(--white); }
    .view-tab:hover:not(.active) { background: var(--gray-100); color: var(--black); }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .page-tabs { display: flex; gap: 2px; }
    .page-tab {
      padding: 5px 13px;
      border: none;
      border-radius: 5px;
      background: none;
      font-size: 12px;
      font-family: inherit;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.12s;
    }
    .page-tab.active { background: var(--gray-100); color: var(--black); font-weight: 500; }
    .page-tab:hover:not(.active) { color: var(--black); }

    .user-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 12px 5px 8px;
      border: 1px solid var(--gray-300);
      border-radius: 20px;
      background: none;
      font-size: 12px;
      font-family: inherit;
      color: var(--black);
      cursor: pointer;
      transition: background 0.12s;
    }
    .user-btn:hover { background: var(--gray-100); }
    .user-avatar {
      width: 20px; height: 20px;
      background: var(--black);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 10px; font-weight: 600;
      flex-shrink: 0;
    }

    /* ── NAME BANNER ── */
    .name-banner {
      background: var(--gray-100);
      border-bottom: 1px solid #dddddd;
      padding: 9px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--black);
      flex-shrink: 0;
    }
    .name-banner-form { display: flex; gap: 7px; align-items: center; }
    .name-banner input {
      padding: 5px 10px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      background: white;
      width: 180px;
    }
    .name-banner input:focus { border-color: var(--black); }
    .name-banner button {
      padding: 5px 13px;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── CONTENT AREA ── */
    .content {
      flex: 1;
      overflow: hidden;
      display: flex;
    }

    /* ── MONTH CALENDAR ── */
    .cal-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
    }

    .dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0 0;
      border-bottom: 1px solid var(--gray-300);
      flex-shrink: 0;
    }
    .dow-cell {
      padding: 10px 16px 9px;
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      flex: 1;
      overflow: hidden;
    }

    .mcell {
      border-right: 1px solid var(--gray-300);
      border-bottom: 1px solid var(--gray-300);
      padding: 12px 14px 10px;
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      overflow: hidden;
    }
    .mcell:nth-child(7n) { border-right: none; }
    .mcell:hover { background: var(--gray-100); }
    .mcell:hover .mday { color: var(--black); }

    .mcell.other-month { background: #fcfcfc; }
    .mcell.other-month .mday { color: var(--gray-300); }

    .mcell.is-today { background: #f8f8f8; }
    .mcell.is-selected {
      outline: 2px solid var(--black);
      outline-offset: -2px;
      background: white;
      z-index: 1;
    }

    .mday {
      font-size: 12px;
      font-weight: 400;
      color: var(--gray-700);
      line-height: 1;
    }
    .mcell.is-today .mday {
      color: var(--black);
      font-weight: 600;
    }

    /* Thin slot indicator lines */
    .slot-lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow: hidden;
    }
    .slot-line {
      height: 2px;
      border-radius: 2px;
      background: var(--gray-500);
      opacity: 0.55;
      flex-shrink: 0;
    }
    .slot-line.mine {
      background: var(--black);
      opacity: 1;
    }
    .slot-line-label {
      font-size: 9px;
      color: var(--gray-500);
      letter-spacing: 0.2px;
    }

    /* ── WEEK VIEW ── */
    .week-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
    }
    .week-head-row {
      display: grid;
      grid-template-columns: 48px repeat(7, 1fr);
      border-bottom: 1px solid var(--gray-300);
      flex-shrink: 0;
    }
    .week-head-gutter { border-right: 1px solid var(--gray-300); }
    .week-head-col {
      padding: 10px 8px 9px;
      border-right: 1px solid var(--gray-300);
      text-align: center;
      cursor: pointer;
    }
    .week-head-col:last-child { border-right: none; }
    .wh-dow {
      font-size: 9px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }
    .wh-num {
      font-size: 18px;
      font-weight: 300;
      color: var(--gray-700);
      font-family: 'Instrument Serif', serif;
      line-height: 1;
    }
    .week-head-col.wh-today .wh-num { color: var(--black); font-weight: 400; }
    .week-head-col.wh-selected .wh-num {
      background: var(--black);
      color: white;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      margin: 0 auto;
    }

    .week-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
    }
    .wtime-col {
      width: 48px;
      flex-shrink: 0;
      border-right: 1px solid var(--gray-300);
    }
    .wtime-label {
      height: 28px;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 8px;
      font-size: 9px;
      color: var(--gray-500);
      letter-spacing: 0.2px;
    }
    .wtime-label.hl { color: var(--gray-700); font-weight: 500; }

    .wday-cols {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .wday-col { border-right: 1px solid var(--gray-300); }
    .wday-col:last-child { border-right: none; }

    .wslot {
      height: 28px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
      display: flex; align-items: center;
      padding: 0 5px;
      gap: 3px;
    }
    .wslot:hover { background: var(--gray-100); }
    .wslot.wslot-hour { border-bottom-color: var(--gray-300); }
    .wslot.wslot-mine { background: var(--gray-100); }
    .wslot.wslot-mine:hover { background: #ebebeb; }
    .wslot-dot {
      width: 5px; height: 5px;
      background: var(--black);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .wslot-count {
      font-size: 9px;
      color: var(--gray-500);
    }

    /* ── DAY VIEW ── */
    .day-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
    }
    .day-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--gray-300);
      flex-shrink: 0;
    }
    .day-header h2 {
      font-size: 20px;
      font-weight: 300;
      color: var(--black);
    }
    .day-header h2 em { font-style: normal; color: var(--black); }
    .day-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
    }
    .dtime-col {
      width: 64px;
      flex-shrink: 0;
    }
    .dtime-label {
      height: 28px;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 12px;
      font-size: 10px;
      color: var(--gray-500);
    }
    .dtime-label.hl { color: var(--gray-700); font-weight: 500; }
    .dslots-col {
      flex: 1;
      border-left: 1px solid var(--gray-300);
    }
    .dslot {
      height: 28px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
      display: flex; align-items: center;
      padding: 0 12px;
      gap: 6px;
    }
    .dslot:hover { background: var(--gray-100); }
    .dslot.dslot-hour { border-bottom-color: var(--gray-300); }
    .dslot.dslot-mine { background: var(--gray-100); }
    .dslot.dslot-mine:hover { background: #ebebeb; }
    .dslot-dot {
      width: 6px; height: 6px;
      background: var(--black);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dslot-count {
      font-size: 13px;
      color: var(--gray-500);
    }

    /* ── DETAIL PANEL ── */
    .detail-panel {
      width: 280px;
      flex-shrink: 0;
      border-left: 1px solid var(--gray-300);
      background: var(--white);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-header {
      padding: 28px 24px 16px;
      border-bottom: 1px solid var(--gray-300);
      flex-shrink: 0;
    }
    .detail-day-num {
      font-family: 'Instrument Serif', serif;
      font-size: 52px;
      font-weight: 300;
      line-height: 1;
      color: var(--black);
      margin-bottom: 2px;
    }
    .detail-day-num em { font-style: italic; color: var(--black); }
    .detail-month {
      font-size: 13px;
      color: var(--gray-500);
      letter-spacing: 0.2px;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .detail-section-label {
      padding: 16px 24px 8px;
      font-size: 9px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-slot {
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.1s;
      border-bottom: 1px solid var(--gray-100);
    }
    .detail-slot:hover { background: var(--gray-100); }
    .detail-slot.ds-mine { background: var(--gray-100); }
    .detail-slot.ds-mine:hover { background: #ebebeb; }

    .ds-time {
      font-size: 14px;
      color: var(--black);
      letter-spacing: 0.1px;
    }
    .ds-time-end {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 1px;
    }
    .ds-right {
      display: flex; align-items: center; gap: 6px;
    }
    .ds-count {
      font-size: 11px;
      color: var(--gray-500);
    }
    .ds-mine-dot {
      width: 6px; height: 6px;
      background: var(--black);
      border-radius: 50%;
    }

    .detail-empty {
      padding: 32px 24px;
      font-size: 14px;
      color: var(--gray-400, #aaa);
      line-height: 1.6;
    }

    /* Show all / collapse */
    .detail-show-more {
      padding: 10px 24px;
      font-size: 11px;
      color: var(--black);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      text-align: left;
    }
    .detail-show-more:hover { text-decoration: underline; }

    /* ── MODAL ── */
    .backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
    }
    .backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: white;
      border-radius: 14px;
      padding: 32px;
      width: 400px;
      max-width: 92vw;
      box-shadow: 0 24px 64px rgba(0,0,0,0.12);
      transform: translateY(6px) scale(0.99);
      transition: transform 0.18s;
    }
    .backdrop.open .modal { transform: none; }

    .modal-eyebrow {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .modal h2 {
      font-size: 22px;
      font-weight: 300;
      margin-bottom: 3px;
    }
    .modal-subline {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 6px;
    }
    .modal-subline::before {
      content: '';
      display: block;
      width: 5px; height: 5px;
      background: var(--black);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .modal label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .modal input[type="text"] {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input[type="text"]:focus { border-color: var(--black); }

    .modal-attendees {
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--gray-100);
      border-radius: 8px;
    }
    .modal-attendees-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .attendee {
      font-size: 14px;
      color: var(--gray-700);
      padding: 3px 0;
      display: flex; align-items: center; gap: 7px;
    }
    .attendee::before {
      content: '';
      width: 4px; height: 4px;
      background: var(--gray-500);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .modal-actions {
      display: flex; gap: 8px; margin-top: 22px;
    }
    .btn {
      flex: 1; padding: 10px 16px;
      border: none; border-radius: 8px;
      font-size: 13px; font-family: inherit; font-weight: 500;
      cursor: pointer; transition: all 0.14s;
    }
    .btn-primary { background: var(--black); color: white; }
    .btn-primary:hover { background: #333333; }
    .btn-ghost { background: var(--gray-100); color: var(--gray-700); }
    .btn-ghost:hover { background: var(--gray-300); }
    .btn-danger { background: #fff0f0; color: #c44; }
    .btn-danger:hover { background: #ffe0e0; }

    /* ── OTHER PAGES ── */
    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px;
    }
    .page-content h2 {
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 6px;
    }
    .page-subtitle {
      font-size: 15px;
      color: var(--gray-500);
      margin-bottom: 32px;
    }

    .slot-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--gray-300);
    }
    .slr-label { font-size: 14px; }
    .slr-sub { font-size: 14px; color: var(--gray-500); margin-top: 2px; }

    .empty-page {
      text-align: center;
      padding: 80px 24px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 14px; }
    .empty-page h2 { font-size: 20px; font-weight: 300; margin-bottom: 8px; }
    .empty-page p { font-size: 15px; color: var(--gray-500); margin-bottom: 20px; }

    .green-btn {
      padding: 9px 22px;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    /* Admin */
    .admin-section { margin-bottom: 32px; }
    .admin-date-head {
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--gray-300);
      margin-bottom: 10px;
      font-family: 'Instrument Serif', serif;
    }
    .admin-slot-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 7px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .asr-time { width: 90px; font-size: 14px; color: var(--gray-700); flex-shrink: 0; }
    .asr-names { display: flex; flex-wrap: wrap; gap: 4px; }
    .asr-name {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 20px;
      background: var(--gray-100);
      color: var(--black);
    }

    .admin-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      background: #fef9e7;
      color: #8a6c00;
      border-radius: 10px;
      font-weight: 500;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }

    /* spinner */
    .ob-spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--gray-300);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* loading overlay */
    #app-loading {
      position: fixed; inset: 0;
      background: white;
      display: flex; align-items: center; justify-content: center;
      z-index: 2000;
      transition: opacity 0.3s;
    }

    .ob-hint {

    /* text / email input */

    /* ── TIME SLIDER ── */

      font-family: 'Instrument Serif', serif;

      position: absolute;

    .ts-slot {
      flex-shrink: 0;
      width: 60px;
      position: relative;
    }
    .ts-tick-line {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 1px;
      background: rgba(0,0,0,0.18);

    .ts-slot.major .ts-tick-line {

    .ts-time-label {
      position: absolute;
      top: 14px;
      left: 0;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      white-space: nowrap;
      letter-spacing: 0.4px;

    /* fixed selection window */

      position: absolute;
      top: 0; bottom: 0;

      transform: translateX(-50%);
      border: 1.5px solid rgba(0,0,0,0.75);

    /* subtle gradient fade on edges */

      margin-top: 10px;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<script type="module">
// ══════════════════════════════════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════════════════════════════════
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         sendSignInLinkToEmail, isSignInWithEmailLink,
         signInWithEmailLink, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, addDoc, deleteDoc, getDocs,
         query, where, onSnapshot, doc, setDoc, getDoc,
         writeBatch, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            'AIzaSyDSRSo-Rnvex5e1XnvzaL3gTp-OxP_ZrN4',
  authDomain:        'pray-for-gp.firebaseapp.com',
  projectId:         'pray-for-gp',
  storageBucket:     'pray-for-gp.firebasestorage.app',
  messagingSenderId: '264571030758',
  appId:             '1:264571030758:web:c4cb9c99e9e9e602973f27',
};

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

const ACTION_CODE_SETTINGS = {
  url: 'https://caleb-nugent.github.io/pray-for-grants-pass/',
  handleCodeInApp: true,
};
const EMAIL_KEY = 'pfgp_emailForSignIn';
const PENDING_PROFILE_KEY = 'pfgp_pendingProfile';

// ══════════════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════════════
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_FULL  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS     = ['January','February','March','April','May','June','July',
                    'August','September','October','November','December'];

const ALL_SLOTS = (() => {
  const s = [];
  for (let h = 5; h < 23; h++)
    for (let m = 0; m < 60; m += 15)
      s.push({ hour: h, min: m });
  return s;
})();

// ══════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════
const S = {
  view: 'month', page: 'calendar',
  cursor: new Date(), selected: new Date(),
  userName: '', currentUser: null,
  slots: [],           // populated by Firestore listener
  adminUnlocked: false,
  showAllDetail: false,
  initialized: false,
};

let unsubSlots = null;

// ══════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════
const pad     = n  => String(n).padStart(2,'0');
const same    = (a,b) => a.getFullYear()===b.getFullYear()
                      && a.getMonth()===b.getMonth()
                      && a.getDate()===b.getDate();
const isToday = d  => same(d, new Date());

function slotKey(date, h, m) {
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}-${pad(h)}-${pad(m)}`;
}
function parseKey(k) {
  const [y,mo,d,h,mi] = k.split('-').map(Number);
  return { year:y, month:mo-1, day:d, hour:h, min:mi };
}
function fmtTime(h, m) {
  return `${h%12||12}:${pad(m)} ${h>=12?'PM':'AM'}`;
}
function fmtDate(d) {
  return `${DAYS_FULL[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
}
function signupsFor(key)  { return S.slots.filter(s => s.slotKey === key); }
function myKeys() {
  if (!S.currentUser) return [];
  return S.slots.filter(s => s.userId === S.currentUser.uid).map(s => s.slotKey);
}
function weekDays(cursor) {
  const dow = cursor.getDay();
  return Array.from({length:7}, (_,i) => {
    const d = new Date(cursor); d.setDate(cursor.getDate() - dow + i); return d;
  });
}
function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n%100;
  return s[(v-20)%10] || s[v] || s[0];
}
function hideLoading() {
  const el = document.getElementById('app-loading');
  if (!el) return;
  el.classList.add('fade');
  setTimeout(() => el.style.display='none', 320);
}

// ══════════════════════════════════════════════════════════════════════
// FIRESTORE
// ══════════════════════════════════════════════════════════════════════
function setupSlotsListener() {
  if (unsubSlots) unsubSlots();
  unsubSlots = onSnapshot(collection(db, 'prayer_slots'), snap => {
    S.slots = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (S.initialized) render();
  }, err => console.error('Slots listener:', err));
}

async function addSlotToDb(key) {
  if (!S.currentUser) return;
  await addDoc(collection(db, 'prayer_slots'), {
    userId:    S.currentUser.uid,
    userName:  S.userName,
    slotKey:   key,
    createdAt: serverTimestamp(),
  });
}

async function removeSlotFromDb(key) {
  if (!S.currentUser) return;
  const q    = query(collection(db, 'prayer_slots'),
    where('userId',  '==', S.currentUser.uid),
    where('slotKey', '==', key));
  const snap = await getDocs(q);
  const batch = writeBatch(db);
  snap.forEach(d => batch.delete(doc(db, 'prayer_slots', d.id)));
  await batch.commit();
  document.getElementById('backdrop').classList.remove('open');
}

async function saveProfile(uid, data) {
  await setDoc(doc(db, 'profiles', uid), data);
}
async function loadProfile(uid) {
  const snap = await getDoc(doc(db, 'profiles', uid));
  return snap.exists() ? snap.data() : null;
}

function generateSlotKeys(ob) {
  const today = new Date();
  const keys  = [];
  if (ob.frequency === 'daily') {
    for (let i = 0; i < 30; i++) {
      const d = new Date(today); d.setDate(today.getDate() + i);
      keys.push(slotKey(d, ob.hour, ob.min||0));
    }
  } else if (ob.frequency === 'weekly' && ob.days.length > 0) {
    for (let i = 0; i < 56; i++) {
      const d = new Date(today); d.setDate(today.getDate() + i);
      if (ob.days.includes(d.getDay())) keys.push(slotKey(d, ob.hour, ob.min||0));
    }
  } else if (ob.frequency === 'monthly' && ob.days.length > 0) {
    for (let m = 0; m < 4; m++) {
      ob.days.forEach(dom => {
        const d = new Date(today.getFullYear(), today.getMonth() + m, dom);
        if (d >= today && d.getDate() === dom) keys.push(slotKey(d, ob.hour, ob.min||0));
      });
    }
  } else if (ob.hour !== null) {
    keys.push(slotKey(today, ob.hour, ob.min||0));
  }
  return keys;
}

// ══════════════════════════════════════════════════════════════════════
// AUTH STATE
// ══════════════════════════════════════════════════════════════════════
onAuthStateChanged(auth, async user => {
  if (user) {
    S.currentUser = user;
    let profile = await loadProfile(user.uid);

    // New user arriving via magic link — save pending onboarding data
    if (!profile) {
      const pending = localStorage.getItem(PENDING_PROFILE_KEY);
      if (pending) {
        const pd = JSON.parse(pending);
        await saveProfile(user.uid, { ...pd, createdAt: serverTimestamp() });
        profile = pd;

        // Batch-write their chosen slots
        if (pd.preferredHour !== null) {
          const keys  = generateSlotKeys({ ...pd, hour: pd.preferredHour, days: pd.preferredDays || [] });
          const batch = writeBatch(db);
          keys.forEach(k => batch.set(doc(collection(db, 'prayer_slots')), {
            userId: user.uid, userName: pd.name,
            slotKey: k, createdAt: serverTimestamp(),
          }));
          await batch.commit();
        }
        localStorage.removeItem(PENDING_PROFILE_KEY);
      }
    }

    if (profile) S.userName = profile.name || '';
    setupSlotsListener();
    // hide onboarding
    const ov = document.getElementById('ob-overlay');
    ov.classList.add('ob-exit');
    setTimeout(() => { ov.style.display = 'none'; }, 480);
    S.initialized = true;
    hideLoading();
    render();
  } else {
    S.currentUser = null;
    S.userName    = '';
    S.slots       = [];
    if (unsubSlots) { unsubSlots(); unsubSlots = null; }
    S.initialized = true;
    hideLoading();
    // show onboarding
    const ov = document.getElementById('ob-overlay');
    ov.style.display = 'flex';
    ov.classList.remove('ob-exit');
    OB.step = 0; OB.mode = 'onboard'; OB.loading = false; OB.error = '';
    obRender();
    render();
  }
});

  closeUserMenu();
  await signOut(auth);
}

function obToggleDay(val) {
  const i = OB.days.indexOf(val);
  if (i===-1) OB.days.push(val); else OB.days.splice(i,1);
  obRender();
}

function obNext() {
  if (OB.transitioning) return;
  const steps  = obSteps();
  const stepId = steps[OB.step];
  OB.error = '';

  if (stepId === 'name') {
    const v = document.getElementById('ob-name-inp')?.value.trim();
    if (!v) { document.getElementById('ob-name-inp').style.borderBottomColor='#c44'; return; }
    OB.name = v;
  }
  if (stepId === 'auth') {
    const e = document.getElementById('ob-email-inp')?.value.trim();
    const p = document.getElementById('ob-pass-inp')?.value || '';
    if (!e) { document.getElementById('ob-email-inp').style.borderBottomColor='#c44'; return; }
    if (p.length < 6) { OB.error='Password must be at least 6 characters.'; obRender(); return; }
    OB.email = e; OB.password = p;
  }
  if (stepId === 'frequency' && !OB.frequency) return;

  OB.transitioning = true;
  document.querySelector('.ob-step-inner')?.classList.add('ob-exit-step');
  setTimeout(() => { OB.step++; OB.transitioning=false; obRender(); }, 200);
}

async function obFinish() {
  OB.loading = true; OB.error = ''; obRender();
  try {
    const cred = await createUserWithEmailAndPassword(auth, OB.email, OB.password);
    const uid  = cred.user.uid;
    await saveProfile(uid, {
      name: OB.name, email: OB.email,
      notificationConsent: OB.emailConsent,
      frequency: OB.frequency,
      preferredDays: OB.days, preferredHour: OB.hour,
      createdAt: serverTimestamp(),
    });
    if (OB.hour !== null) {
      const keys  = generateSlotKeys(OB);
      const batch = writeBatch(db);
      keys.forEach(k => batch.set(doc(collection(db, 'prayer_slots')), {
        userId: uid, userName: OB.name,
        slotKey: k, createdAt: serverTimestamp(),
      }));
      await batch.commit();
    }
    // onAuthStateChanged fires and transitions to app
  } catch (err) {
    OB.loading = false;
    if (err.code === 'auth/email-already-in-use') {
      OB.error = 'That email is already registered. <a href="#" onclick="OB.mode=\'signin\';OB.error=\'\';obRender();return false" style="color:var(--black)">Sign in instead.</a>';
    } else {
      OB.error = err.message;
    }
    obRender();
  }
}

async function obResend() {
  try {
    await sendSignInLinkToEmail(auth, OB.email, ACTION_CODE_SETTINGS);
    // briefly flash confirmation
    const btn = document.querySelector('[onclick="obResend()"]');
    if (btn) { btn.textContent = 'Sent ✓'; btn.style.color='var(--black)'; }
  } catch (err) { console.error(err); }
}

async function obSignIn() {
  const email = document.getElementById('ob-si-email')?.value.trim();
  const pass  = document.getElementById('ob-si-pass')?.value || '';
  if (!email || !pass) return;
  OB.email = email;
  OB.loading = true; OB.error = ''; obRender();
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    // onAuthStateChanged handles the rest
  } catch (err) {
    OB.loading = false;
    OB.error = (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password')
      ? 'Incorrect email or password.' : err.message;
    obRender();
  }
}

// Separate function for the magic-link sign-in path
async function obSendLink() {
  const email = document.getElementById('ob-link-email')?.value.trim();
  if (!email) return;
  OB.email = email;
  OB.loading = true; OB.error = ''; obRender();
  try {
    localStorage.setItem(EMAIL_KEY, email);
    await sendSignInLinkToEmail(auth, email, ACTION_CODE_SETTINGS);
    OB.loading = false;
    OB.mode = 'sent';
    obRender();
  } catch (err) {
    OB.loading = false;
    OB.error = err.message;
    obRender();
  }
}

function obSkip() {
  document.getElementById('ob-overlay').classList.add('ob-exit');
  setTimeout(() => { document.getElementById('ob-overlay').style.display='none'; }, 480);
  S.initialized = true; render();
}

// ══════════════════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════════════════
function navigate(dir) {
  const d = new Date(S.cursor);
  if (S.view==='day') d.setDate(d.getDate()+dir);
  else if (S.view==='week') d.setDate(d.getDate()+dir*7);
  else d.setMonth(d.getMonth()+dir);
  S.cursor = d; render();
}
function goToday()      { S.cursor=S.selected=new Date(); render(); }
function switchView(v)  { S.view=v; render(); }
function setPage(p)     { S.page=p; render(); }
function selectDay(y,m,d) {
  S.selected=new Date(y,m,d); S.cursor=new Date(y,m,d);
  S.showAllDetail=false; render();
}

// ══════════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════════
function render() {
  if (!S.initialized) return;

  const d = S.cursor;
  let mlabel = '';
  if (S.view==='day') mlabel=`${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  else if (S.view==='week') {
    const wd=weekDays(d), a=wd[0], b=wd[6];
    mlabel = a.getMonth()===b.getMonth()
      ? `${MONTHS[a.getMonth()]} ${a.getFullYear()}`
      : `${MONTHS[a.getMonth()].slice(0,3)} – ${MONTHS[b.getMonth()].slice(0,3)} ${a.getFullYear()}`;
  } else {
    mlabel = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }
  document.getElementById('month-label').innerHTML = mlabel +
    ` <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`;

  const uname = S.userName || (S.currentUser ? S.currentUser.email?.split('@')[0] : 'Sign in');
  document.getElementById('user-label').textContent  = uname;
  document.getElementById('user-avatar').textContent = uname[0]?.toUpperCase() || '?';

  ['day','week','month'].forEach(v =>
    document.getElementById('vt-'+v).classList.toggle('active', S.view===v));
  ['calendar','mine','admin'].forEach(p =>
    document.getElementById('pt-'+p).classList.toggle('active', S.page===p));

  const ct = document.getElementById('content');
  if (S.page==='admin') { ct.innerHTML=renderAdmin(); return; }
  if (S.page==='mine')  { ct.innerHTML=renderMySlots(); return; }

  let cal = '';
  if (S.view==='month')      cal=renderMonthCal();
  else if (S.view==='week')  cal=renderWeekCal();
  else                       cal=renderDayCal();
  ct.innerHTML = cal + renderDetailPanel();

  if (S.view!=='month') {
    const sc = ct.querySelector('.week-body,.day-body');
    if (sc) sc.scrollTop=(7-5)*4*28;
  }
}

// ══════════════════════════════════════════════════════════════════════
// CALENDAR VIEWS
// ══════════════════════════════════════════════════════════════════════
function renderMonthCal() {
  const year=S.cursor.getFullYear(), month=S.cursor.getMonth();
  const first=new Date(year,month,1).getDay(), dim=new Date(year,month+1,0).getDate();
  const mk=new Set(myKeys());
  const dowRow = DAYS_SHORT.map(d=>`<div class="dow-cell">${d}</div>`).join('');
  let cells='';

  for (let i=0;i<first;i++){
    const pd=new Date(year,month,-first+i+1);
    cells+=`<div class="mcell other-month" onclick="selectDay(${pd.getFullYear()},${pd.getMonth()},${pd.getDate()})"><div class="mday">${pd.getDate()}</div></div>`;
  }
  for (let day=1;day<=dim;day++){
    const date=new Date(year,month,day);
    const dStr=`${year}-${pad(month+1)}-${pad(day)}`;
    const isSel=same(date,S.selected);
    const uKeys=[...new Set(S.slots.filter(s=>s.slotKey.startsWith(dStr)).map(s=>s.slotKey))];
    const lines=uKeys.slice(0,5).map(k=>`<div class="slot-line ${mk.has(k)?'mine':''}"></div>`).join('');
    cells+=`
      <div class="mcell${isToday(date)?' is-today':''}${isSel?' is-selected':''}"
           onclick="selectDay(${year},${month},${day})">
        <div class="mday">${day}</div>
        <div class="slot-lines">${lines}</div>
      </div>`;
  }
  const rem=(first+dim)%7===0?0:7-(first+dim)%7;
  for (let i=1;i<=rem;i++)
    cells+=`<div class="mcell other-month" onclick="selectDay(${year},${month+1},${i})"><div class="mday">${i}</div></div>`;

  return `<div class="cal-wrap"><div class="dow-row">${dowRow}</div><div class="month-grid">${cells}</div></div>`;
}

function renderWeekCal() {
  const days=weekDays(S.cursor), mk=new Set(myKeys());
  const headCols=days.map(d=>{
    const cls=`week-head-col${isToday(d)?' wh-today':''}${same(d,S.selected)?' wh-selected':''}`;
    return `<div class="${cls}" onclick="selectDay(${d.getFullYear()},${d.getMonth()},${d.getDate()})">
      <div class="wh-dow">${DAYS_SHORT[d.getDay()]}</div>
      <div class="wh-num">${d.getDate()}</div>
    </div>`;
  }).join('');
  const gutter=ALL_SLOTS.map(({hour,min})=>
    `<div class="wtime-label${min===0?' hl':''}">${min===0?fmtTime(hour,0).replace(':00 ',' '):''}</div>`).join('');
  let dayCols='';
  days.forEach(d=>{
    const rows=ALL_SLOTS.map(({hour,min})=>{
      const k=slotKey(d,hour,min), sups=signupsFor(k), mine=mk.has(k);
      return `<div class="wslot${mine?' wslot-mine':''}${min===0?' wslot-hour':''}" onclick="openSlot('${k}')">
        ${mine?'<div class="wslot-dot"></div>':''}
        ${sups.length>0&&!mine?`<div class="wslot-count">${sups.length}</div>`:''}
      </div>`;
    }).join('');
    dayCols+=`<div class="wday-col">${rows}</div>`;
  });
  return `
    <div class="week-wrap">
      <div class="week-head-row"><div class="week-head-gutter"></div>${headCols}</div>
      <div class="week-body"><div class="wtime-col">${gutter}</div><div class="wday-cols">${dayCols}</div></div>
    </div>`;
}

function renderDayCal() {
  const d=S.cursor, mk=new Set(myKeys());
  const gutter=ALL_SLOTS.map(({hour,min})=>
    `<div class="dtime-label${min===0?' hl':''}">${min===0?fmtTime(hour,0).replace(':00 ',' '):''}</div>`).join('');
  const rows=ALL_SLOTS.map(({hour,min})=>{
    const k=slotKey(d,hour,min), sups=signupsFor(k), mine=mk.has(k);
    return `<div class="dslot${mine?' dslot-mine':''}${min===0?' dslot-hour':''}" onclick="openSlot('${k}')">
      ${mine?'<div class="dslot-dot"></div>':''}
      ${sups.length>0?`<div class="dslot-count">${sups.length} praying</div>`:''}

    <div class="day-wrap">
      <div class="day-header"><h2>${DAYS_FULL[d.getDay()]} <em>${d.getDate()}</em></h2></div>

function renderDetailPanel() {
  const sel=S.selected;
  const dStr=`${sel.getFullYear()}-${pad(sel.getMonth()+1)}-${pad(sel.getDate())}`;
  const mk=new Set(myKeys());
  const dayKeys=[...new Set(S.slots.filter(s=>s.slotKey.startsWith(dStr)).map(s=>s.slotKey))];
  const LIMIT=6;
  let slotItems='';

  if (dayKeys.length===0) {
    slotItems=`<div class="detail-empty">No slots yet.<br>${S.currentUser?'Click a time to sign up.':'Sign in to add yourself.'}</div>`;
  } else {
    const shown=S.showAllDetail?dayKeys:dayKeys.slice(0,LIMIT);
    shown.sort().forEach(k=>{
      const p=parseKey(k), sups=signupsFor(k), mine=mk.has(k);
      slotItems+=`
        <div class="detail-slot${mine?' ds-mine':''}" onclick="openSlot('${k}')">
          <div>
            <div class="ds-time">${fmtTime(p.hour,p.min)}</div>
            <div class="ds-time-end">${fmtTime(p.hour,p.min+15)}</div>
          </div>
          <div class="ds-right">
            ${sups.length>0?`<span class="ds-count">${sups.length}</span>`:''}
            ${mine?'<div class="ds-mine-dot"></div>':''}
          </div>
        </div>`;
    });
    if (!S.showAllDetail && dayKeys.length>LIMIT)
      slotItems+=`<button class="detail-show-more" onclick="S.showAllDetail=true;render()">+ ${dayKeys.length-LIMIT} more</button>`;
  }

  return `
    <div class="detail-panel">
      <div class="detail-header">
        <div class="detail-day-num">${isToday(sel)?`<em>${sel.getDate()}</em>`:sel.getDate()}</div>
        <div class="detail-month">${MONTHS[sel.getMonth()]} · ${DAYS_FULL[sel.getDay()]}</div>
      </div>
      <div class="detail-body">
        <div class="detail-section-label">Prayer slots</div>
        ${slotItems}
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════════════
// SLOT MODAL
// ══════════════════════════════════════════════════════════════════════
let pendingKey = null;

function openSlot(key) {
  if (!S.currentUser) {
    OB.mode='signin'; OB.error='';
    const ov=document.getElementById('ob-overlay');
    ov.style.display='flex'; ov.classList.remove('ob-exit'); obRender(); return;
  }
  pendingKey=key;
  const p=parseKey(key), date=new Date(p.year,p.month,p.day);
  const sups=signupsFor(key), mine=S.slots.some(s=>s.slotKey===key&&s.userId===S.currentUser.uid);

  document.getElementById('m-eyebrow').textContent='Prayer Slot';
  document.getElementById('m-title').textContent=mine?"You're signed up":'Sign up to pray';
  document.getElementById('m-sub').textContent=
    `${fmtDate(date)} · ${fmtTime(p.hour,p.min)} – ${fmtTime(p.hour,p.min+15)}`;

  let body='';
  if (sups.length>0) {
    body=`<div class="modal-attendees">
      <div class="modal-attendees-label">${sups.length} ${sups.length===1?'person':'people'} praying</div>
      <div>${sups.map(s=>`<div class="attendee">${s.userName}</div>`).join('')}</div>
    </div>`;
  }
  document.getElementById('m-body').innerHTML=body;

  document.getElementById('m-actions').innerHTML = mine
    ? `<button class="btn btn-danger"  onclick="removeSlotFromDb('${key}')">Remove signup</button>
       <button class="btn btn-ghost"   onclick="closeModal()">Close</button>`
    : `<button class="btn btn-ghost"   onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="doSignUp('${key}')">Sign me up</button>`;

  document.getElementById('backdrop').classList.add('open');
}

function closeModal(e) {
  if (!e||e.target.id==='backdrop') {
    document.getElementById('backdrop').classList.remove('open');
    pendingKey=null;
  }
}

async function doSignUp(key) {
  if (!S.currentUser) return;
  document.getElementById('backdrop').classList.remove('open');
  await addSlotToDb(key||pendingKey);
  pendingKey=null;
}

  if (!S.adminUnlocked) return `

        <div class="empty-icon">🔒</div><h2>Admin Access</h2>

document.addEventListener('keydown', e=>{
  // Handle onboarding Enter BEFORE the input-guard early return
  const ov=document.getElementById('ob-overlay');
  if (ov && ov.style.display!=='none') {
    if (e.key==='Enter') {
      if (OB.mode==='signin') obSignIn();
      else if (OB.mode==='signin-link') obSendLink();
      else if (OB.mode==='sent') {} // nothing
      else if (['name','auth'].includes(obSteps()[OB.step])) obNext();
    }
    return;
  }
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key==='ArrowLeft')  navigate(-1);
  if (e.key==='ArrowRight') navigate(1);
  if (e.key==='t')          goToday();
  if (e.key==='d')          switchView('day');
  if (e.key==='w')          switchView('week');
  if (e.key==='m')          switchView('month');
  if (e.key==='Escape')     closeModal();
});

// ── TIME SLIDER ──────────────────────────────────────────────────────
const TS = {
  SLOT_PX: 60,
  START_H: 5,
  END_H:   22,   // last hour on slider
  dragging: false,
  startX: 0,
  startOffset: 0,
  offset: 0,
};

function tsOffsetFor(hour, min) {
  const c = document.getElementById('ts-container');
  if (!c) return 0;
  const slotIdx = (hour - TS.START_H) * 4 + Math.round((min||0) / 15);
  return c.offsetWidth / 2 - slotIdx * TS.SLOT_PX - TS.SLOT_PX / 2;
}

function tsClamp(offset) {
  const c = document.getElementById('ts-container');
  if (!c) return offset;
  const totalSlots = (TS.END_H - TS.START_H) * 4;
  const min = c.offsetWidth / 2 - totalSlots * TS.SLOT_PX - TS.SLOT_PX / 2;
  const max = c.offsetWidth / 2 - TS.SLOT_PX / 2;
  return Math.max(min, Math.min(max, offset));
}

function tsApply(offset, animate) {
  const track = document.getElementById('ts-track');
  const c = document.getElementById('ts-container');
  if (!track || !c) return;
  offset = tsClamp(offset);
  TS.offset = offset;
  track.style.transition = animate ? 'transform 0.18s ease-out' : 'none';
  track.style.transform = `translateX(${offset}px)`;
  // derive time
  const rawSlot = (c.offsetWidth / 2 - offset - TS.SLOT_PX / 2) / TS.SLOT_PX;
  const totalSlots = (TS.END_H - TS.START_H) * 4;
  const slot = Math.max(0, Math.min(totalSlots, Math.round(rawSlot)));
  const totalMin = TS.START_H * 60 + slot * 15;
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  OB.hour = h; OB.min = m;
  const lbl = document.getElementById('ts-label');
  if (lbl) lbl.textContent = fmtTime(h, m);
}

function tsInit(hour, min) {
  const track = document.getElementById('ts-track');
  const c = document.getElementById('ts-container');
  if (!track || !c) return;
  let inner = '';
  for (let h = TS.START_H; h <= TS.END_H; h++) {
    for (let m = 0; m < 60; m += 15) {
      const isMajor = m === 0, isHalf = m === 30;
      const cls = isMajor ? 'ts-slot major' : isHalf ? 'ts-slot half' : 'ts-slot';
      const label = isMajor
        ? `<div class="ts-time-label">${fmtTime(h,0).replace(':00 ',' ')}</div>` : '';
      inner += `<div class="${cls}">${label}<div class="ts-tick-line"></div></div>`;
    }
  }
  inner += `<div class="ts-slot"></div>`;
  track.innerHTML = inner;
  tsApply(tsOffsetFor(hour??7, min??0), false);
}

function tsDown(e) {
  TS.dragging = true;
  TS.startX = e.touches ? e.touches[0].clientX : e.clientX;
  TS.startOffset = TS.offset;
  const track = document.getElementById('ts-track');
  if (track) track.style.transition = 'none';
}

function tsMove(e) {
  if (!TS.dragging) return;
  e.preventDefault();
  const isTouch = !!e.touches;
  const x = isTouch ? e.touches[0].clientX : e.clientX;
  const sensitivity = isTouch ? 1 : 2.8; // desktop needs less physical movement
  tsApply(TS.startOffset + (x - TS.startX) * sensitivity, false);
}

function tsUp() {
  if (!TS.dragging) return;
  TS.dragging = false;
  // snap to nearest slot
  const c = document.getElementById('ts-container');
  if (!c) return;
  const rawSlot = (c.offsetWidth / 2 - TS.offset - TS.SLOT_PX / 2) / TS.SLOT_PX;
  const snapped = Math.round(rawSlot);
  const snappedOffset = c.offsetWidth / 2 - snapped * TS.SLOT_PX - TS.SLOT_PX / 2;
  tsApply(snappedOffset, true);
}

  let email = localStorage.getItem(EMAIL_KEY);
  if (!email) {
    // Opened on a different device — ask for email
    email = window.prompt('Please confirm your email address to sign in:');

  if (email) {
    signInWithEmailLink(auth, email, window.location.href)

      })
      .catch(err => {
        console.error('Magic link sign-in failed:', err);
        hideLoading();
      });
  }
}
